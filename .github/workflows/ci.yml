name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOFLAGS: -mod=readonly
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false
      - name: Check formatting
        run: |
          $unformatted = gofmt -l .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($unformatted) { throw "Run gofmt on: $unformatted" }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 ./...
      - name: Check native guard test oracle (temporary)
        if: runner.os == 'Windows'
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $sourcePath = (Resolve-Path internal/snapshot/read_untracked_observation.go).Path
          $source = [IO.File]::ReadAllText($sourcePath).Replace("`r`n", "`n")
          $guard = "`tif err := validateAdministrativeReadNativeInfo(information); err != nil {`n" +
            "`t`treturn fmt.Errorf(`"%w: unsupported untracked native information: %w`", ErrUntrackedInvalid, err)`n" +
            "`t}`n"
          if ([regex]::Matches($source, [regex]::Escape($guard)).Count -ne 1) {
            throw "Expected exactly one native guard in the probe source"
          }
          $probeRoot = Join-Path $env:RUNNER_TEMP ("treeclear-native-guard-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $probeRoot | Out-Null
          try {
            $mutantPath = Join-Path $probeRoot 'observation.go'
            $overlayPath = Join-Path $probeRoot 'overlay.json'
            $resultPath = Join-Path $probeRoot 'result.jsonl'
            $stderrPath = Join-Path $probeRoot 'stderr.txt'
            $encoding = [Text.UTF8Encoding]::new($false)
            [IO.File]::WriteAllText($mutantPath, $source.Replace($guard, ''), $encoding)
            $overlay = @{ Replace = @{ $sourcePath = $mutantPath } } | ConvertTo-Json -Depth 4
            [IO.File]::WriteAllText($overlayPath, $overlay, $encoding)
            go test -count=1 -timeout=60s "-overlay=$overlayPath" -json -run '^TestReadUntrackedNativeWindowsValidatorAttributes$' ./internal/snapshot > $resultPath 2> $stderrPath
            $probeExit = $LASTEXITCODE
            $events = Get-Content $resultPath | ConvertFrom-Json
            $prefix = 'TestReadUntrackedNativeWindowsValidatorAttributes'
            $expected = @("$prefix/reparse", "$prefix/device", "$prefix/reparse-device", "$prefix/unavailable")
            $failed = @($events | Where-Object { $_.Action -eq 'fail' -and $_.Test -like "$prefix/*" } | Select-Object -ExpandProperty Test)
            $safe = @($events | Where-Object { $_.Action -eq 'pass' -and $_.Test -eq "$prefix/ordinary" })
            if ($probeExit -ne 1 -or $failed.Count -ne 4 -or $safe.Count -ne 1) {
              throw "Native guard bypass did not produce the expected four failures and safe control"
            }
            if (@(Compare-Object $expected $failed).Count -ne 0) {
              throw "Native guard bypass failed the wrong test cases"
            }
            Write-Host 'Native guard bypass: four expected negative failures; safe control passed.'
          } finally {
            Remove-Item -LiteralPath $probeRoot -Recurse -Force
          }
          exit 0
      - name: Race test
        run: go test -race -count=1 ./...
      - name: Build
        run: go build ./...
      - name: Check source remains unchanged
        run: |
          $changes = git status --porcelain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($changes) { throw "Verification changed the source tree: $changes" }
