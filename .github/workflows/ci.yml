name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            goos: darwin
            goarch: arm64
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
          - os: windows-2025
            goos: windows
            goarch: amd64
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOFLAGS: -mod=readonly
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false
      - name: Verify native target
        run: |
          $goEnvironment = go env -json GOHOSTOS GOHOSTARCH GOOS GOARCH
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $native = $goEnvironment | ConvertFrom-Json
          if ($native.GOHOSTOS -ne '${{ matrix.goos }}' -or $native.GOOS -ne '${{ matrix.goos }}' -or
              $native.GOHOSTARCH -ne '${{ matrix.goarch }}' -or $native.GOARCH -ne '${{ matrix.goarch }}') {
            throw "Expected native ${{ matrix.goos }}/${{ matrix.goarch }} verification"
          }
          Write-Output "Verified native $($native.GOHOSTOS)/$($native.GOHOSTARCH) target"
      - name: Check formatting
        run: |
          $unformatted = gofmt -l .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($unformatted) { throw "Run gofmt on: $unformatted" }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 ./...
      - name: Race test
        run: go test -race -count=1 ./...
      - name: Build
        run: go build ./...
      - name: Check source remains unchanged
        run: |
          $changes = git status --porcelain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($changes) { throw "Verification changed the source tree: $changes" }
